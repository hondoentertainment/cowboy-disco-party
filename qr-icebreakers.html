<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Printable QR code that opens Cowboy Disco Party ice breakers.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D0D0D">
  <title>Print Ice Breaker QR | Cowboy Disco Party</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
</head>
<body class="qr-print-page">
  <main id="main" class="qr-print" data-qr-block data-qr-path="ice-breaker.html" data-qr-src="/assets/qr-icebreakers.png">
    <div class="qr-print__sheet">
      <div class="brand-lockup brand-lockup--card" style="justify-content: center; margin-bottom: 1rem;">
        <span class="brand-lockup__text">
          <span class="brand-lockup__name">Cowboy Disco Party</span>
          <span class="brand-lockup__sub">Cowboy Disco Saloon</span>
        </span>
      </div>
      <h1 class="qr-print__title">Scan for Ice Breakers</h1>
      <p class="qr-print__subtitle">Opens the conversation deck — no app, no homepage hunt</p>
      <div class="qr-print__frame qr-block__frame">
        <img
          class="qr-block__img qr-print__img"
          src="/assets/qr-icebreakers.png"
          width="320"
          height="320"
          alt="QR code that opens Cowboy Disco Party ice breakers"
        >
        <canvas class="qr-block__canvas is-hidden" data-size="320" width="320" height="320" aria-hidden="true"></canvas>
      </div>
      <p class="qr-print__url qr-block__url"></p>
      <p class="qr-print__date">Sep 19, 2026 · 6:00 PM</p>
    </div>

    <div class="qr-print__actions no-print">
      <button class="btn btn--primary" type="button" onclick="window.print()">Print Sign</button>
      <a class="btn btn--secondary" href="/assets/qr-icebreakers.png" download="cowboy-disco-ice-breakers-qr.png">Download PNG</a>
      <button class="btn btn--secondary qr-block__copy" type="button">Copy link</button>
      <a class="btn btn--secondary" href="ice-breaker.html">Open ice breakers</a>
      <a class="btn btn--secondary" href="qr-pack.html">QR pack</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/premium.js"></script>
</body>
</html>
